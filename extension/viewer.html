<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CourseLens · 复旦 eLearning 文件阅读器</title>
  <link rel="stylesheet" href="vendor/pdf_viewer.css"><link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand"><span id="badge" class="badge">PDF</span><h1 id="title">CourseLens</h1></div>
    <nav id="controls" class="controls" aria-label="文件阅读控制">
      <span id="pdf-controls" class="controls"><button id="previous" title="上一页" disabled>上一页</button>
      <label class="page-label"><span class="sr-only">页码</span><input id="page" type="number" value="1" min="1" disabled></label>
      <span id="page-count">/ —</span>
      <button id="next" title="下一页" disabled>下一页</button>
      <span class="divider"></span></span>
      <button id="zoom-out" aria-label="缩小" disabled>−</button><span id="zoom-label">100%</span>
      <button id="zoom-in" aria-label="放大" disabled>+</button><button id="fit-page" disabled>适应页面</button><button id="fit" disabled>适应宽度</button>
      <label class="sr-only" for="reading-mode">阅读方式</label><select id="reading-mode" disabled><option value="scroll">连续滚动</option><option value="page">手动翻页</option></select>
    </nav>
    <div class="actions"><a id="download" class="button primary" hidden>下载文件</a><a id="standalone" class="button" target="_blank" rel="noopener" hidden>独立阅读 / 授权</a><a id="original" class="button" target="_blank" rel="noopener noreferrer" hidden>打开原文件</a><a class="help" href="help.html" target="_blank" rel="noopener" aria-label="使用帮助">?</a></div>
  </header>
  <aside id="demo-note" hidden>这是内置示例，无需登录或联网。可试用适应页面、连续滚动、手动翻页和 ZIP 内文件切换。</aside>
  <aside id="format-note" hidden>DOCX 复杂版式可能与 Word 不同；如公式或图表缺失，请下载核对。</aside>
  <section id="local-picker" hidden><label class="button">打开本地文件<input id="local-file" type="file" accept=".pdf,.docx,.heic,.heif,.zip,.png,.jpg,.jpeg,.gif,.webp,.bmp,.txt,.md,.csv,.tsv,.json,.log,.py,.c,.cpp,.h,.java,.js,.ts,.sql,.r,.tex,.doc,.xlsx,.pptx" hidden></label><span>文件只在浏览器里读取。</span></section>
  <section id="archive-panel" hidden><label for="archive-entry">ZIP 内文件</label><select id="archive-entry"></select><span id="archive-summary"></span><a id="archive-download" class="button">下载 ZIP</a></section>
  <main id="workspace">
    <section id="status" class="status" aria-live="polite">
      <h2 id="status-title">正在读取 PDF…</h2><p id="status-detail">文件只在你的浏览器中处理。</p>
      <div class="status-actions"><button id="grant" hidden>允许读取文件服务器</button><button id="retry" hidden>重试</button></div>
    </section>
    <div id="pdf-document" hidden></div>
    <div id="other-document" hidden></div>
  </main>
  <footer>CourseLens · 复旦 eLearning 文件阅读器 · 非官方工具 · 文件在浏览器本地解析</footer>
  <script src="catalog.js"></script><script src="core.js"></script><script type="module" src="viewer.mjs"></script>
</body>
</html>
